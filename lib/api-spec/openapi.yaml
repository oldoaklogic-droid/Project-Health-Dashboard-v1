openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project health dashboard data
  - name: bqe
    description: Read-only BQE CORE diagnostics
  - name: pipeline
    description: Lead, intake, and local project operations
  - name: estimating
    description: Historical estimating fingerprints and question tree
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [projects]
      summary: Get the project health dashboard
      responses:
        "200":
          description: Dashboard summary and project records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /projects/{code}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by project code
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update the PM-controlled fields for a project
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid update
        "404":
          description: Project not found
  /bqe/test:
    get:
      operationId: testBqeConnection
      tags: [bqe]
      summary: Fetch BQE project 23-0091
      description: Returns the raw read-only BQE CORE project response for project code 23-0091.
      responses:
        "200":
          description: Raw BQE CORE JSON response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        "401":
          description: Authentication required
        "403":
          description: Dashboard access approval required
        "502":
          description: BQE request failed
        "503":
          description: BQE authorization or configuration requires attention
  /bqe/pull:
    post:
      operationId: runBqePhase1Pull
      tags: [bqe]
      summary: Run the read-only BQE Phase 1 pull
      description: Administrator-only on-demand import. All upstream BQE object requests are GET requests.
      responses:
        "200":
          description: All BQE object pulls and reconciliation completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BqePullResult"
        "207":
          description: Pull completed with one or more independently failed object types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BqePullResult"
        "401":
          description: Authentication required
        "403":
          description: Administrator approval required
        "500":
          description: Pull could not complete
  /bqe/reconciliation:
    get:
      operationId: getBqeReconciliation
      tags: [bqe]
      summary: Get the latest BQE reconciliation summary
      responses:
        "200":
          description: Latest persisted BQE reconciliation summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BqeReconciliation"
        "401":
          description: Authentication required
        "403":
          description: Dashboard access approval required
        "404":
          description: No BQE pull has completed yet
  /leads:
    get:
      operationId: listLeads
      tags: [pipeline]
      summary: List leads
      responses:
        "200":
          description: Leads
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Lead" }
    post:
      operationId: createLead
      tags: [pipeline]
      summary: Create a lead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadInput" }
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
  /leads/{id}:
    patch:
      operationId: updateLead
      tags: [pipeline]
      summary: Update a lead
      parameters:
        - $ref: "#/components/parameters/UuidPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeadUpdate" }
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Lead" }
  /intakes:
    get:
      operationId: listIntakes
      tags: [pipeline]
      summary: List intakes
      responses:
        "200":
          description: Intakes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Intake" }
    post:
      operationId: createIntake
      tags: [pipeline]
      summary: Create an intake
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntakeInput" }
      responses:
        "201":
          description: Created intake
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intake" }
  /intakes/{id}:
    patch:
      operationId: updateIntake
      tags: [pipeline]
      summary: Update an intake
      parameters:
        - $ref: "#/components/parameters/UuidPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntakeUpdate" }
      responses:
        "200":
          description: Updated intake
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intake" }
  /intakes/{id}/estimate:
    get:
      operationId: getIntakeEstimate
      tags: [estimating]
      summary: Recompute an intake estimate
      parameters:
        - $ref: "#/components/parameters/UuidPath"
      responses:
        "200":
          description: Recomputed estimate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Estimate" }
  /intakes/{id}/approve-estimate:
    post:
      operationId: approveIntakeEstimate
      tags: [estimating]
      summary: Approve an intake estimate
      parameters:
        - $ref: "#/components/parameters/UuidPath"
      responses:
        "200":
          description: Approved intake
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Intake" }
  /intakes/{id}/create-project:
    post:
      operationId: createBqeProject
      tags: [pipeline]
      summary: Dry-run or execute BQE project creation
      parameters:
        - $ref: "#/components/parameters/UuidPath"
        - name: dryRun
          in: query
          required: true
          schema: { type: boolean }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                employeeGroupName: { type: string }
      responses:
        "200": { description: Dry-run payload log }
        "201": { description: BQE project and local record created }
        "502": { description: BQE creation stopped with partial progress }
  /local-projects:
    get:
      operationId: listLocalProjects
      tags: [pipeline]
      summary: List local projects
      responses:
        "200":
          description: Local projects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LocalProject" }
  /local-projects/{id}:
    get:
      operationId: getLocalProject
      tags: [pipeline]
      summary: Get a local project
      parameters:
        - $ref: "#/components/parameters/UuidPath"
      responses:
        "200":
          description: Local project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalProject" }
    patch:
      operationId: updateLocalProject
      tags: [pipeline]
      summary: Update an open local project
      parameters:
        - $ref: "#/components/parameters/UuidPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated local project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalProject" }
  /local-projects/{id}/phases:
    patch:
      operationId: updateLocalProjectPhase
      tags: [pipeline]
      summary: Update an open local project phase
      parameters:
        - $ref: "#/components/parameters/UuidPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, status]
              properties:
                name: { type: string }
                status:
                  type: string
                  enum: [Not Started, In Progress, Complete]
      responses:
        "200":
          description: Updated local project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalProject" }
  /local-projects/{id}/change-orders:
    post:
      operationId: createChangeOrder
      tags: [pipeline]
      summary: Add a local change order
      parameters:
        - $ref: "#/components/parameters/UuidPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [description, reason, requestedHours]
              properties:
                description: { type: string }
                reason: { type: string }
                requestedHours: { type: number, minimum: 0 }
                authorized: { type: boolean }
      responses:
        "201":
          description: Updated local project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalProject" }
  /local-projects/{id}/change-orders/{changeOrderId}:
    patch:
      operationId: authorizeChangeOrder
      tags: [pipeline]
      summary: Authorize or revoke a local change order
      parameters:
        - $ref: "#/components/parameters/UuidPath"
        - name: changeOrderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorized]
              properties:
                authorized: { type: boolean }
      responses:
        "200":
          description: Updated local project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalProject" }
  /local-projects/{id}/closeout:
    post:
      operationId: closeLocalProject
      tags: [pipeline]
      summary: Validate and close a local project
      parameters:
        - $ref: "#/components/parameters/UuidPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actualHours]
              properties:
                actualHours:
                  type: object
                  additionalProperties: { type: number, minimum: 0 }
                varianceReason: { type: string }
                varianceNote: { type: string }
      responses:
        "200":
          description: Closed local project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocalProject" }
  /estimating/fingerprints:
    get:
      operationId: getEstimatingFingerprints
      tags: [estimating]
      summary: Get immutable historical fingerprints
      responses:
        "200":
          description: Fingerprints by discipline
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /question-tree:
    get:
      operationId: getQuestionTree
      tags: [estimating]
      summary: Get the seeded intake question tree
      responses:
        "200":
          description: Active question tree
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
  /bqe/clients/search:
    get:
      operationId: searchCachedBqeClients
      tags: [bqe]
      summary: Search BQE clients from PostgreSQL pull data only
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        "200":
          description: Matching cached BQE projects and clients
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
components:
  parameters:
    UuidPath:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    LeadInput:
      type: object
      required: [who, what, where, source, spotter]
      properties:
        who: { type: string }
        what: { type: string }
        where: { type: string }
        source: { type: string }
        spotter: { type: string }
        status:
          type: string
          enum: [New, Moved to Intake, Dropped]
    LeadUpdate:
      allOf:
        - $ref: "#/components/schemas/LeadInput"
      required: []
    Lead:
      allOf:
        - $ref: "#/components/schemas/LeadInput"
        - type: object
          required: [id, status, createdAt]
          properties:
            id: { type: string }
            createdAt: { type: string, format: date-time }
    IntakeInput:
      type: object
      required: [client]
      properties:
        leadId: { type: [string, "null"] }
        client: { type: string }
        contact: { type: [string, "null"] }
        phone: { type: [string, "null"] }
        email: { type: [string, "null"] }
        address: { type: [string, "null"] }
        parcel: { type: [string, "null"] }
        referralSource: { type: [string, "null"] }
        primaryRequest: { type: [string, "null"] }
        propertyPlans: { type: [string, "null"] }
        disciplines:
          type: array
          items: { type: string }
        answers: { type: object, additionalProperties: true }
        drivers:
          type: object
          additionalProperties: { type: number, minimum: 0 }
        stepFlags:
          type: object
          additionalProperties: { type: boolean }
        contractType: { type: [string, "null"] }
        paymentTerms: { type: [string, "null"] }
        startDate: { type: [string, "null"], format: date }
        targetCompletion: { type: [string, "null"], format: date }
        pmByDiscipline:
          type: object
          additionalProperties: { type: string }
        overrides: { type: object, additionalProperties: true }
    IntakeUpdate:
      allOf:
        - $ref: "#/components/schemas/IntakeInput"
      required: []
    Intake:
      allOf:
        - $ref: "#/components/schemas/IntakeInput"
        - type: object
          required: [id, createdAt, disciplines, answers, drivers, stepFlags, pmByDiscipline, overrides]
          properties:
            id: { type: string }
            estimateApprovedAt: { type: [string, "null"], format: date-time }
            createdAt: { type: string, format: date-time }
    Estimate:
      type: object
      required: [disciplines, totalHours, totalFee, rate]
      properties:
        disciplines:
          type: array
          items:
            type: object
            additionalProperties: true
        totalHours: { type: number }
        totalFee: { type: number }
        rate: { type: number }
    LocalProject:
      type: object
      additionalProperties: true
      required: [id, intakeId, projectNumber, name, client, pm, disciplines, status]
      properties:
        id: { type: string }
        intakeId: { type: string }
        projectNumber: { type: string }
        name: { type: string }
        client: { type: string }
        pm: { type: string }
        disciplines:
          type: array
          items: { type: string }
        status: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BqeObjectCounts:
      type: object
      required: [project, timeentry, activity, budget, invoice, payment]
      properties:
        project: { type: number }
        timeentry: { type: number }
        activity: { type: number }
        budget: { type: number }
        invoice: { type: number }
        payment: { type: number }
    BqeProjectTotals:
      type: object
      required: [hours, invoicedAmount, paymentsReceived]
      properties:
        hours: { type: number }
        invoicedAmount: { type: number }
        paymentsReceived: { type: number }
    BqeProjectReconciliation:
      type: object
      required: [exact, rolledUp]
      properties:
        exact:
          $ref: "#/components/schemas/BqeProjectTotals"
        rolledUp:
          $ref: "#/components/schemas/BqeProjectTotals"
    BqeInvoiceClassification:
      type: object
      required: [status, type, isDraft, isVoid, count, grossInvoiceAmount, netBilledWithTax]
      properties:
        status: { type: ["number", "null"] }
        type: { type: ["number", "null"] }
        isDraft: { type: boolean }
        isVoid: { type: boolean }
        count: { type: number }
        grossInvoiceAmount: { type: number }
        netBilledWithTax: { type: number }
    BqeInvoiceRegister:
      type: object
      required: [grossHeaderCount, grossInvoiceAmount, detailRowCount, registerCount, netBilledWithTax, excludedFinanceChargeCount, financeChargeAmount, excludedDraftCount, excludedZeroAmountCount, excluded250InvoiceNumber, classifications]
      properties:
        grossHeaderCount: { type: number }
        grossInvoiceAmount: { type: number }
        detailRowCount: { type: number }
        registerCount: { type: number }
        netBilledWithTax: { type: number }
        excludedFinanceChargeCount: { type: number }
        financeChargeAmount: { type: number }
        excludedDraftCount: { type: number }
        excludedZeroAmountCount: { type: number }
        excluded250InvoiceNumber: { type: ["string", "null"] }
        classifications:
          type: array
          items:
            $ref: "#/components/schemas/BqeInvoiceClassification"
    BqeReconciliation:
      type: object
      required: [pullRunId, completedAt, reportingYear, asOfDate, objectCounts, total2026Hours, excludedFutureHours, total2026InvoicedAmount, invoiceRegister, total2026PaymentsReceived, perProject]
      properties:
        pullRunId: { type: string }
        completedAt: { type: string, format: date-time }
        reportingYear: { type: number }
        asOfDate: { type: string }
        objectCounts:
          $ref: "#/components/schemas/BqeObjectCounts"
        total2026Hours: { type: number }
        excludedFutureHours: { type: number }
        total2026InvoicedAmount: { type: number }
        invoiceRegister:
          $ref: "#/components/schemas/BqeInvoiceRegister"
        total2026PaymentsReceived: { type: number }
        perProject:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/BqeProjectReconciliation"
    BqePullResult:
      type: object
      required: [pullRunId, status, startedAt, completedAt, objectCounts, errors, reconciliation]
      properties:
        pullRunId: { type: string }
        status:
          type: string
          enum: [completed, partial, failed]
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        objectCounts:
          $ref: "#/components/schemas/BqeObjectCounts"
        errors:
          type: object
          additionalProperties: { type: string }
        reconciliation:
          oneOf:
            - $ref: "#/components/schemas/BqeReconciliation"
            - type: "null"
    Project:
      type: object
      required: [code, name, client, pm, priority, overall, confidence, contractValue, contractValueVisible, budgetExists, pctAvail, pctComplete, dueAvail, dueDate, recent90, laborWip, expenseWip, openAr, exposure, bqeMatched, bqePulledAt, actualHours, budgetHours, invoicedAmount, paidAmount, reconciliationHours, reconciliationInvoicedAmount, reconciliationPaidAmount, reconciliationRolledUpHours, reconciliationRolledUpInvoicedAmount, reconciliationRolledUpPaidAmount, deliverable, etcHours, scopeNote, blocker, nextAction, owner, actionDue, lastContact, pmUpdate]
      properties:
        code: { type: string }
        name: { type: string }
        client: { type: string }
        pm: { type: string }
        priority: { type: string }
        overall: { type: string }
        confidence: { type: string }
        contractValue: { type: number }
        contractValueVisible: { type: boolean }
        budgetExists: { type: boolean }
        pctAvail: { type: boolean }
        pctComplete: { type: number }
        dueAvail: { type: boolean }
        dueDate: { type: ["string", "null"] }
        recent90: { type: number }
        laborWip: { type: number }
        expenseWip: { type: number }
        openAr: { type: number }
        exposure: { type: number }
        bqeMatched: { type: boolean }
        bqePulledAt: { type: ["string", "null"] }
        actualHours: { type: ["number", "null"] }
        budgetHours: { type: ["number", "null"] }
        invoicedAmount: { type: ["number", "null"] }
        paidAmount: { type: ["number", "null"] }
        reconciliationHours: { type: ["number", "null"] }
        reconciliationInvoicedAmount: { type: ["number", "null"] }
        reconciliationPaidAmount: { type: ["number", "null"] }
        reconciliationRolledUpHours: { type: ["number", "null"] }
        reconciliationRolledUpInvoicedAmount: { type: ["number", "null"] }
        reconciliationRolledUpPaidAmount: { type: ["number", "null"] }
        deliverable: { type: string }
        etcHours: { type: ["number", "null"] }
        scopeNote: { type: string }
        blocker: { type: string }
        nextAction: { type: string }
        owner: { type: string }
        actionDue: { type: ["string", "null"] }
        lastContact: { type: ["string", "null"] }
        pmUpdate: { type: boolean }
    ProjectUpdate:
      type: object
      properties:
        deliverable: { type: string }
        etcHours: { type: ["number", "null"] }
        scopeNote: { type: string }
        blocker: { type: string }
        nextAction: { type: string }
        owner: { type: string }
        actionDue: { type: ["string", "null"] }
        lastContact: { type: ["string", "null"] }
        pmUpdate: { type: boolean }
    Coverage:
      type: object
      required: [label, count, pct, note]
      properties:
        label: { type: string }
        count: { type: number }
        pct: { type: number }
        note: { type: string }
    DashboardSummary:
      type: object
      required: [activeRoots, namedPm, financialExposure, overall, confidence, coverage, byPm]
      properties:
        activeRoots: { type: number }
        namedPm: { type: number }
        financialExposure: { type: number }
        overall:
          type: object
          additionalProperties: { type: number }
        confidence:
          type: object
          additionalProperties: { type: number }
        coverage:
          type: array
          items: { $ref: "#/components/schemas/Coverage" }
        byPm:
          type: object
          additionalProperties: { type: number }
    Dashboard:
      type: object
      required: [extractDate, overlayUpdated, bqe, summary, projects]
      properties:
        extractDate: { type: string }
        overlayUpdated: { type: string }
        bqe:
          $ref: "#/components/schemas/DashboardBqeStatus"
        summary: { $ref: "#/components/schemas/DashboardSummary" }
        projects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
    DashboardBqeTotals:
      type: object
      required: [hours, budgetHours, invoicedAmount, paidAmount]
      properties:
        hours: { type: number }
        budgetHours: { type: number }
        invoicedAmount: { type: number }
        paidAmount: { type: number }
    DashboardBqeReconciliation:
      type: object
      required: [reportingYear, asOfDate, hours, excludedFutureHours, invoicedAmount, invoiceRegister, paidAmount]
      properties:
        reportingYear: { type: number }
        asOfDate: { type: string }
        hours: { type: number }
        excludedFutureHours: { type: number }
        invoicedAmount: { type: number }
        invoiceRegister:
          $ref: "#/components/schemas/BqeInvoiceRegister"
        paidAmount: { type: number }
    DashboardBqeStatus:
      type: object
      required: [state, pullStatus, completedAt, matchedProjects, objectCounts, errors, totals, reconciliation]
      properties:
        state:
          type: string
          enum: [fresh, stale, partial, empty]
        pullStatus:
          type: ["string", "null"]
        completedAt:
          type: ["string", "null"]
        matchedProjects: { type: number }
        objectCounts:
          type: object
          additionalProperties: { type: number }
        errors:
          type: object
          additionalProperties: { type: string }
        totals:
          $ref: "#/components/schemas/DashboardBqeTotals"
        reconciliation:
          oneOf:
            - $ref: "#/components/schemas/DashboardBqeReconciliation"
            - type: "null"

